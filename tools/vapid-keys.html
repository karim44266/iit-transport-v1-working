<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Push keys</title>
<body style="font:16px system-ui;max-width:680px;margin:30px auto;padding:0 16px">
<h2>Generate push notification keys</h2>
<p>This page runs only in your browser. Nothing is sent anywhere. Do this once.</p>
<button id="g" style="font:inherit;padding:10px 18px">Generate keys</button>
<pre id="o" style="white-space:pre-wrap;word-break:break-all;background:#eee;padding:12px;margin-top:16px"></pre>
<script>
const b64=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const un=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
g.onclick=async()=>{const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']),j=await crypto.subtle.exportKey('jwk',k.privateKey);
 o.textContent='VAPID_PUBLIC_KEY  (goes in js/config.js AND in a Supabase secret):\n'+b64(new Uint8Array([4,...un(j.x),...un(j.y)]))+'\n\nVAPID_PRIVATE_KEY  (ONLY as a Supabase secret. Never share it, never commit it):\n'+j.d};
</script>
